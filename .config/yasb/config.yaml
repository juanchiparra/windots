watch_stylesheet: true
watch_config: true
debug: false
update_check: true
bars:
    primary-bar:
        enabled: true
        screens:
            - "*"
        class_name: yasb-bar
        alignment:
            position: top
            align: center
        animation:
            enabled: false
            duration: 300
        blur_effect:
            enabled: true
            round_corners: true
            round_corners_type: normal
            border_color: system
        window_flags:
            always_on_top: false
            windows_app_bar: true
        dimensions:
            width: 100%
            height: 35
        padding:
            top: 2
            left: 2
            bottom: 0
            right: 2
        widgets:
            left:
                - glazewm_workspaces
            center:
                - clock
            right:
                - systray
                - volume
                - power_menu
widgets:
    glazewm_workspaces:
        type: glazewm.workspaces.GlazewmWorkspacesWidget
        options:
            hide_if_offline: true
            monitor_exclusive: false

    clock:
        type: yasb.clock.ClockWidget
        options:
            label: "{%H:%M}<span>{alarm}</span>"
            label_alt: "{%a, %d %b %H:%M}"
            timezones: []
            calendar:
                blur: true
                round_corners: true
                alignment: center
                direction: down
                extended: false
                show_years: true
                show_holidays: false
                show_week_numbers: true
            callbacks:
                on_left: toggle_calendar
                on_middle: toggle_label
                on_right: context_menu

    volume:
        type: yasb.volume.VolumeWidget
        options:
            label: "<span class='icon'>{icon}</span>"
            label_alt: "<span class='icon'>{icon}</span>{level}"
            tooltip: true
            icons:
                muted: "\uE74F"
                "10": "\uE992"
                "30": "\uE993"
                "60": "\uE994"
                "100": "\uE995"
            callbacks:
                on_left: toggle_volume_menu
                on_right: toggle_mute
            audio_menu:
                blur: true
                round_corners: true
                round_corners_type: normal
                border_color: system
                alignment: right
                direction: down
                show_apps: true
                show_app_labels: false
                show_app_icons: true
                show_apps_expanded: false
                app_icons:
                    toggle_down: "\uE972"
                    toggle_up: "\uE971"

    systray:
        type: yasb.systray.SystrayWidget
        options:
            icon_size: 14
            show_unpinned: false
            show_in_popup: false
            use_hook: false

    power_menu:
        type: yasb.power_menu.PowerMenuWidget
        options:
            label: "<span class='icon'>\uE7E8</span>"
            menu_style: "popup"
            buttons:
                lock: ["\uE72E", "Lock"]
                sleep: ["\uE708", "Sleep"]
                restart: ["\uE777", "Restart"]
                shutdown: ["\uE7E8", "Shutdown"]
                cancel: ["\uE711", "Cancel"]
