watch_stylesheet: true
watch_config: true
debug: false
update_check: true
bars:
    primary-bar:
        enabled: true
        screens:
            - "*"
        class_name: yasb-bar
        alignment:
            position: top
            align: center
        animation:
            enabled: false
            duration: 300
        blur_effect:
            enabled: true
            round_corners: true
            round_corners_type: normal
            border_color: system
        window_flags:
            always_on_top: false
            windows_app_bar: true
        dimensions:
            width: 100%
            height: 35
        padding:
            top: 2
            left: 2
            bottom: 0
            right: 2
        widgets:
            left:
                - glazewm_workspaces
            center:
                - clock
            right:
                - systray
                - volume
                - control_center
widgets:
    glazewm_workspaces:
        type: glazewm.workspaces.GlazewmWorkspacesWidget
        options:
            hide_if_offline: true
            monitor_exclusive: false

    clock:
        type: yasb.clock.ClockWidget
        options:
            label: "{%H:%M}<span>{alarm}</span>"
            label_alt: "{%a, %d %b %H:%M}"
            timezones: []
            calendar:
                blur: true
                round_corners: true
                alignment: center
                direction: down
                extended: false
                show_years: true
                show_holidays: false
                show_week_numbers: true
            callbacks:
                on_left: toggle_calendar
                on_middle: toggle_label
                on_right: context_menu

    volume:
        type: yasb.volume.VolumeWidget
        options:
            label: "<span class='icon'>{icon}</span>"
            label_alt: "<span class='icon'>{icon}</span>{level}"
            tooltip: true
            icons:
                muted: "\uE74F"
                "10": "\uE992"
                "30": "\uE993"
                "60": "\uE994"
                "100": "\uE995"
            callbacks:
                on_left: toggle_volume_menu
                on_right: toggle_mute
            audio_menu:
                blur: true
                round_corners: true
                round_corners_type: normal
                border_color: system
                alignment: right
                direction: down
                show_apps: true
                show_app_labels: false
                show_app_icons: true
                show_apps_expanded: false
                app_icons:
                    toggle_down: "\uE972"
                    toggle_up: "\uE971"

    systray:
        type: yasb.systray.SystrayWidget
        options:
            class_name: "systray"
            label_collapsed: "•••"
            label_expanded: "• • •"
            label_position: "right"
            icon_size: 16
            pin_click_modifier: "alt"
            show_in_popup: true
            icons_per_row: 4
            popup:
                blur: true
                round_corners: true
                round_corners_type: "normal"
                border_color: None
                alignment: "center"
                direction: "down"
                offset_top: 6
                offset_left: 0

    control_center:
        type: "yasb.control_center.ControlCenterWidget"
        options:
            label: "<span>\ue713</span>"
            tooltip: true
            sections_order:
                - "system_controls"
                - "quick_actions"
                - "sliders"
                - "power"
                - "media"
            popup:
                alignment: "center"
                direction: "down"
                border_color: System
                round_corners: true
                round_corners_type: normal
                offset_top: 8
            sections:
                system_controls:
                    profile_image_size: 28
                    power_icon: "\uE7E8"
                    lock_icon: "\uE72E"
                    settings_icon: "\uE713"
                quick_actions:
                    show: true
                    columns: 3
                    label_position: "default"
                    actions:
                        - id: "toggle_dnd"
                          label: "Do Not Disturb"
                          icon: "\uf285"
                        - id: "toggle_mute"
                          label: "Mute"
                          icon: "\ue74f"
                        - id: "toggle_mic_mute"
                          label: "Mic Mute"
                          icon: "\uF12E"
                        - id: "screenshot"
                          label: "Screenshot"
                          icon: "\ue91b"
                        - id: "touch_keyboard"
                          label: "Keyboard"
                          icon: "\uE765"
                        - id: "toggle_theme"
                          label: "Dark Mode"
                          icon: "\uE708"
                sliders:
                    show: true
                    brightness:
                        show_slider: true
                        icon: "\uE706"
                        show_source_selector: true
                        source_selector_icon: "\uE972"
                    volume:
                        show_slider: true
                        icon: "\uE767"
                        show_source_selector: true
                        source_selector_icon: "\uE972"
                    microphone:
                        show_slider: true
                        icon: "\uE720"
                        show_source_selector: true
                        source_selector_icon: "\uE972"
                media:
                    show: true
                    thumbnail_size: 36
                    thumbnail_radius: 4
                    icons:
                        prev_track: "\ue622"
                        next_track: "\ue623"
                        play: "\uf5b0"
                        pause: "\ue62e"
                power:
                    show: true
                    power_plan_title: "Power Plan"
                    power_mode_title: "Power Mode"
                    button_menu_icon: "\ue76c"
            callbacks:
                on_left: "toggle_menu"
